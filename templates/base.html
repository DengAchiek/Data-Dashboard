<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
        }
        .nav-link.active {
            font-weight: bold;
            border-bottom: 2px solid #ffc107;
        }
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #fff;
            display: inline-block;
            text-align: center;
            line-height: 30px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{{ url_for('index') }}">📊 Dashboard</a>

  <div class="ms-auto d-flex align-items-center gap-3">
    {% if session.get('user') %}
      <div class="dropdown">
        <a class="btn btn-dark dropdown-toggle d-flex align-items-center" href="#" role="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
          <div class="avatar me-2">👤</div>
          {{ session.get('user').split('@')[0] }}
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
          <li><a class="dropdown-item" href="#">Profile</a></li>
          <li><a class="dropdown-item" href="#">Settings</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
      </div>
    {% else %}
      <a class="btn btn-outline-light {% if request.endpoint == 'login' %}active{% endif %}" href="{{ url_for('login') }}">Login</a>
      <a class="btn btn-outline-success {% if request.endpoint == 'signup' %}active{% endif %}" href="{{ url_for('signup') }}">Sign Up</a>
    {% endif %}
    <button class="btn btn-outline-warning" id="toggleMode">🌙 Toggle Mode</button>
  </div>
</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>

<footer>
    <p>&copy; 2025 Data Dashboard | ChinksCodeLab CCl</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const toggleBtn = document.getElementById("toggleMode");
  toggleBtn.addEventListener("click", () => {
    const html = document.documentElement;
    const current = html.getAttribute("data-bs-theme");
    html.setAttribute("data-bs-theme", current === "dark" ? "light" : "dark");
  });
</script>
</body>
</html>
